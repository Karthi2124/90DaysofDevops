services:
  app:
    build: .
    container_name: node_app

    ports:
      - "5000:5000"

    env_file:
      - app/.env

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge